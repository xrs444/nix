name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read

env:
  PUSHGATEWAY: http://localhost:9091
  APPRISE_URL: https://apprise.xrs444.net/notify/apprise
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NIX_CONFIG: "accept-flake-config = true"

jobs:
  check-queue:
    name: Skip if newer run queued
    runs-on: [self-hosted, nixos, builder]
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        run: |
          NEWER=$(curl -sf \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?branch=${{ github.ref_name }}&status=queued&per_page=20" \
            | jq "[.workflow_runs[] | select(.id > ${{ github.run_id }})] | length")
          if [ "${NEWER:-0}" -gt 0 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping — ${NEWER} newer run(s) already queued for this branch."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Build, Cache, and Deploy All Hosts
    needs: check-queue
    if: needs.check-queue.outputs.should_run == 'true'
    runs-on: [self-hosted, nixos, builder]
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v7

      - name: Prepare post-build cache hook
        run: |
          echo "=== Signing diagnostics ==="
          echo "Running as: $(id)"
          echo "Key permissions: $(ls -la /run/secrets/nixcache_signing_key 2>&1 || echo 'KEY NOT FOUND')"
          echo "==========================="
          chmod +x .github/scripts/nix-post-build-hook.sh

      - name: Build and cache all hosts
        run: |
          ts() { date '+[%H:%M:%S]'; }
          HOSTS=(xsvr1 xsvr2 xsvr3 xsvr4 xcomm1 xts1 xidm1 xpbx1 xlt1-t-vnixos xdt1-t xlt2-s vocibuild)
          REMOTE_HOSTS=(xsvr2 xsvr3 xsvr4 xcomm1 xts1 xidm1 xpbx1 xlt1-t-vnixos xdt1-t xlt2-s vocibuild)
          # Arch split so x86_64 hosts (built on xsvr1/xsvr2/xsvr3/xdt1-t) and
          # aarch64 hosts (delegated to the native ARM builders xlt1-t-vnixos/
          # vocibuild) build concurrently instead of one arch sitting idle while
          # the other builds. See nix/modules/services/remotebuilds/default.nix.
          X64_HOSTS=(xsvr1 xsvr2 xsvr3 xsvr4 xcomm1 xdt1-t xlt2-s)
          ARM_HOSTS=(xts1 xidm1 xpbx1 xlt1-t-vnixos vocibuild)

          # Pre-evaluate all host derivation paths (evaluation only — no building).
          # Stored so we can quickly check each host's transitive drv closure later
          # without re-evaluating the flake inside the build loop.
          # Capped at MAX_PARALLEL_EVAL concurrent `nix eval` procs — running all 12
          # at once (bug-651, recurred bug-651 2026-08-27) pushed xsvr1 into swap
          # thrashing (5.5GB+ swap, load avg 17-26, procs in D-state), stalling the
          # step for 40+ minutes instead of the usual ~15s.
          MAX_PARALLEL_EVAL=4
          declare -A HOST_DRV
          EVAL_TMPDIR=$(mktemp -d)
          echo "$(ts) === Pre-evaluating host derivation paths (max $MAX_PARALLEL_EVAL concurrent) ==="
          running=0
          for host in "${HOSTS[@]}"; do
            (
              drv=$(nix eval --raw \
                ".#nixosConfigurations.$host.config.system.build.toplevel.drvPath" 2>/dev/null || true)
              echo "${drv}" > "$EVAL_TMPDIR/$host"
              [ -n "$drv" ] \
                && echo "$(ts)   $host: $(basename "$drv")" \
                || echo "$(ts)   $host: eval failed (will attempt build anyway)"
            ) &
            running=$((running + 1))
            if [ "$running" -ge "$MAX_PARALLEL_EVAL" ]; then
              wait -n
              running=$((running - 1))
            fi
          done
          wait
          for host in "${HOSTS[@]}"; do
            HOST_DRV[$host]=$(cat "$EVAL_TMPDIR/$host" 2>/dev/null || true)
          done
          rm -rf "$EVAL_TMPDIR"
          echo "$(ts) ============================================"

          RESULTS_DIR=$(mktemp -d)

          # Builds one arch group's hosts sequentially (so a group never contends with
          # itself for the same physical builder), while the other group's build_group
          # runs concurrently in a sibling background process. Failed hosts for this
          # group are written to $RESULTS_DIR/failed.<group> for the parent to collect.
          build_group() {
            local group="$1"; shift
            local hosts=("$@")
            local FAILED=()
            local FAILED_DRVS=()

            for host in "${hosts[@]}"; do
              echo "$(ts) [$group] Building $host..."

              # Short-circuit: if a prior build in this group failed, check whether this
              # host's closure contains the same failing derivation before wasting a full
              # build attempt. nix-store --query --requisites lists all transitive drv
              # inputs of a .drv, so a hash match means this host would hit the identical
              # build failure. Scoped per-group since x86 and aarch64 closures don't share drvs.
              if [ ${#FAILED_DRVS[@]} -gt 0 ] && [ -n "${HOST_DRV[$host]:-}" ]; then
                HOST_DEPS=$(nix-store --query --requisites "${HOST_DRV[$host]}" 2>/dev/null || true)
                for failed_drv in "${FAILED_DRVS[@]}"; do
                  if echo "$HOST_DEPS" | grep -qxF "$failed_drv"; then
                    echo "$(ts) [$group] $host: SKIPPED — closure shares previously failed derivation: $(basename "$failed_drv")"
                    FAILED+=("$host")
                    continue 2
                  fi
                done
              fi

              # 150m wall-clock backstop + 30m silence watchdog. The 40m flat cap
              # (pre-2026-08-28) was firing on legitimate cold builds after the
              # nixpkgs 26.05 bump (xdt1-t/xlt1-t-vnixos/xlt2-s queued 156-413
              # derivations and were killed mid-build, misreported as an
              # unreachable builder). --max-silent-time is the real guard for
              # that original case (bug-502/653: a builder VM suspending
              # without closing its connection stops producing output) — it
              # fires on 30m of silence, faster than the old 40m cap, so
              # raising the wall clock doesn't weaken hang protection.
              for attempt in 1 2; do
                BUILD_LOG=$(mktemp)
                timeout 150m nix build ".#nixosConfigurations.$host.config.system.build.toplevel" --no-link \
                  --max-silent-time 1800 \
                  --log-format bar-with-logs \
                  --post-build-hook "$GITHUB_WORKSPACE/.github/scripts/nix-post-build-hook.sh" \
                  2>&1 | tee "$BUILD_LOG"
                BUILD_RC=${PIPESTATUS[0]}
                if [ $BUILD_RC -eq 124 ]; then
                  echo "$(ts) [$group] $host: BUILD EXCEEDED 150m WALL CLOCK"
                fi

                # A remote builder's input-closure push can die mid-transfer,
                # leaving the remote store missing an input ("path ... is not
                # valid") — confirmed on vocibuild in run 33146595655 alongside
                # "unexpected end-of-file" from the SSH copy. That's transient;
                # retry once, but only for this signature, so a genuine build
                # failure doesn't just double the runtime.
                if [ $BUILD_RC -ne 0 ] && [ "$attempt" -eq 1 ] && grep -qE \
                     'unexpected end-of-file|is not valid|Timeout was reached|kex_exchange_identification' \
                     "$BUILD_LOG"; then
                  echo "$(ts) [$group] $host: transient transfer failure — retrying once"
                  rm -f "$BUILD_LOG"
                  continue
                fi
                break
              done

              if [ $BUILD_RC -ne 0 ]; then
                # Extract leaf-failing drv paths from Nix's error output and propagate
                # them forward so subsequent hosts in this group that share the same
                # drv can be skipped.
                mapfile -t NEW_FAILED_DRVS < <(
                  grep -oP "(?<=error: builder for ')(/nix/store/[^']+\.drv)(?=' failed)" "$BUILD_LOG" || true
                )
                if [ ${#NEW_FAILED_DRVS[@]} -gt 0 ]; then
                  FAILED_DRVS+=("${NEW_FAILED_DRVS[@]}")
                  printf "$(ts) [$group]   Tracking failed drv: %s\n" "${NEW_FAILED_DRVS[@]}"
                fi
                FAILED+=("$host")
                echo "$(ts) [$group] $host: BUILD FAILED"
                rm -f "$BUILD_LOG"
                continue
              fi

              rm -f "$BUILD_LOG"
              echo "$(ts) [$group] $host: BUILD OK"

              # For remote hosts, also build and cache the deploy-rs activatable path.
              # deploy-rs deploys .#deploy.nodes.$host.profiles.system.path, not the plain
              # toplevel. Evaluate via the same flake attribute deploy-rs uses so the
              # signed hash matches exactly what gets pushed to the remote.
              if [[ " ${REMOTE_HOSTS[*]} " == *" $host "* ]]; then
                echo "$(ts) [$group] $host: building deploy-rs activatable path..."
                if ! timeout 150m nix build --no-link \
                  --max-silent-time 1800 \
                  --log-format bar-with-logs \
                  --post-build-hook "$GITHUB_WORKSPACE/.github/scripts/nix-post-build-hook.sh" \
                  ".#deploy.nodes.$host.profiles.system.path" 2>&1; then
                  # Previously swallowed with `|| true`, which hid deploy-rs build
                  # failures (e.g. F1: crates.io 403) for the ~90 minutes until the
                  # Deploy remote hosts step failed for the same reason with no
                  # earlier warning. Keep the run going — the deploy step below
                  # will surface the real failure — but don't hide it either.
                  echo "$(ts) [$group] WARNING: $host activatable path failed to build — deploy will likely fail"
                fi
              fi
            done

            printf '%s\n' "${FAILED[@]}" > "$RESULTS_DIR/failed.$group"
          }

          # Run both arch groups concurrently. `( ... ) &` forks the current shell,
          # so each subshell inherits build_group/HOST_DRV/HOSTS/etc. directly —
          # no export needed. Each keeps its own local FAILED/FAILED_DRVS state.
          build_group x64 "${X64_HOSTS[@]}" &
          X64_PID=$!
          build_group arm "${ARM_HOSTS[@]}" &
          ARM_PID=$!
          wait "$X64_PID" "$ARM_PID"

          FAILED=()
          for group in x64 arm; do
            while IFS= read -r h; do
              [ -n "$h" ] && FAILED+=("$h")
            done < "$RESULTS_DIR/failed.$group"
          done
          rm -rf "$RESULTS_DIR"

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "BUILD_FAILED_HOSTS=${FAILED[*]}" >> "$GITHUB_ENV"
            echo "Build failures: ${FAILED[*]} — continuing to deploy successful hosts"
          fi

      - name: Cache paths built by remote builders
        run: |
          # The --post-build-hook in the build step fires only for locally-built
          # derivations. Paths built on xsvr2/xsvr3/xdt1-t and copied back to
          # xsvr1's store are not covered. Sign and cache their closures here.
          HOSTS=(xsvr1 xsvr2 xsvr3 xsvr4 xcomm1 xts1 xidm1 xpbx1 xlt1-t-vnixos xdt1-t xlt2-s vocibuild)
          for host in "${HOSTS[@]}"; do
            toplevel=$(nix path-info \
              ".#nixosConfigurations.$host.config.system.build.toplevel" 2>/dev/null) || continue
            nix-store --query --requisites "$toplevel" 2>/dev/null \
              | xargs -r nix store sign --key-file /run/secrets/nixcache_signing_key || true
            nix copy --to "file:///zfs/nixcache/cache" "$toplevel" 2>/dev/null || true
          done

      - name: Cache deploy-rs binary
        run: |
          # deploy-rs pushes its own binary (deploy-rs-0.1.0) and activate-rs to each
          # remote host so it can invoke activate-rs for the system switch. These paths
          # are not part of any NixOS system closure, so the per-host build loop above
          # never covers them. Without a signed narinfo in the file cache, the remote
          # daemon rejects them (require-sigs=true, no trusted-user bypass in modern Nix).
          #
          # Build via our own flake's ".#deploy-rs" output, NOT the bare
          # "deploy-rs#deploy-rs" flake ref (even with --inputs-from). A bare ref
          # re-resolves deploy-rs's own checked-in flake.lock, which pins its own
          # unrelated nixpkgs (2025-03-26) — --inputs-from only patches indirect/
          # registry lookups made *during* evaluation, it does not override a
          # flake's own already-locked inputs. That stale nixpkgs still fetches
          # crates from the now-403ing https://crates.io/api/v1/... endpoint.
          # ".#deploy-rs" (flake.nix) re-exports inputs.deploy-rs.packages.<system>.default,
          # which correctly inherits THIS flake's deploy-rs.inputs.nixpkgs.follows
          # fix (routes crate fetches via static.crates.io instead). Confirmed by
          # direct build: --inputs-from . deploy-rs#deploy-rs still 403'd; the
          # equivalent inputs.deploy-rs.packages.*.default build succeeded.
          nix build --no-link \
            --post-build-hook "$GITHUB_WORKSPACE/.github/scripts/nix-post-build-hook.sh" \
            ".#deploy-rs" 2>/dev/null \
            && echo "deploy-rs binary signed and cached" \
            || echo "WARNING: could not build deploy-rs binary — deploy may fail"

      - name: Deploy remote hosts
        run: |
          ts() { date '+[%H:%M:%S]'; }
          REVISION=$(git rev-parse HEAD)
          REMOTE_HOSTS=(xsvr2 xsvr3 xsvr4 xcomm1 xts1 xidm1 xpbx1 xlt1-t-vnixos xdt1-t xlt2-s vocibuild)
          # xlt2-s is a laptop that's only powered on when in use (unlike xcomm1,
          # which reliably wakes via WoWLAN) — being unreachable here is expected,
          # not a failure. Hosts in this list get a visible SKIPPED note instead of
          # counting toward DEPLOY_FAILED / the job's exit code.
          OPTIONAL_HOSTS=(xlt2-s)
          read -ra FAILED_HOSTS <<< "${BUILD_FAILED_HOSTS:-}"
          DEPLOY_FAILED=()
          SKIPPED=()

          for host in "${REMOTE_HOSTS[@]}"; do
            if [[ " ${FAILED_HOSTS[*]} " == *" $host "* ]]; then
              echo "$host: skipping deploy (build failed)"
              continue
            fi

            # xcomm1 is normally suspended; send a WoWLAN magic packet so the Intel
            # WiFi NIC wakes it, then wait up to 90s for SSH to become available.
            if [[ "$host" == "xcomm1" ]]; then
              echo "Sending WoWLAN magic packet to xcomm1 (D4:D2:52:A9:5B:4B)..."
              wakeonlan -i 172.19.112.255 D4:D2:52:A9:5B:4B || true
              echo "Waiting up to 90s for xcomm1 to come online..."
              for i in $(seq 1 18); do
                if ssh -4 \
                     -i /run/secrets/deploy_private_key \
                     -o StrictHostKeyChecking=no \
                     -o UserKnownHostsFile=/dev/null \
                     -o ConnectTimeout=5 \
                     -o BatchMode=yes \
                     deploy@xcomm1.lan "true" 2>/dev/null; then
                  echo "xcomm1 is online after ~$((i * 5))s"
                  break
                fi
                sleep 5
              done
            fi

            # xlt2-s is only powered on when in use; send a WOL magic packet to its
            # wired NIC (connected to xswoffice, VLAN 100, confirmed via Omada) so it
            # wakes for deploy, then wait up to 90s for SSH to become available.
            if [[ "$host" == "xlt2-s" ]]; then
              echo "Sending WOL magic packet to xlt2-s (64-C9-01-A7-82-85)..."
              wakeonlan -i 172.18.100.255 64:C9:01:A7:82:85 || true
              echo "Waiting up to 90s for xlt2-s to come online..."
              for i in $(seq 1 18); do
                if ssh -4 \
                     -i /run/secrets/deploy_private_key \
                     -o StrictHostKeyChecking=no \
                     -o UserKnownHostsFile=/dev/null \
                     -o ConnectTimeout=5 \
                     -o BatchMode=yes \
                     deploy@xlt2-s.lan "true" 2>/dev/null; then
                  echo "xlt2-s is online after ~$((i * 5))s"
                  break
                fi
                sleep 5
              done
            fi

            # Hostname pre-flight: SSH to the target and verify it reports the expected
            # hostname before deploying. Guards against two failure modes:
            #   1. Host is offline (SSH times out → skip safely)
            #   2. DNS resolves to the wrong machine (e.g. stale cache pointing xcomm1.lan
            #      at xsvr1) — the wrong machine would return a different hostname, causing
            #      deploy-rs to activate the wrong config on xsvr1 and kill the CI runner.
            # vocibuild is on Oracle Cloud, not .lan — reachable via vocibuild.xrs444.net
            # (ProxyJump through the xts VIP, configured in programs.ssh.extraConfig).
            DEPLOY_HOSTNAME="${host}.lan"
            if [[ "$host" == "vocibuild" ]]; then
              DEPLOY_HOSTNAME="vocibuild.xrs444.net"
            fi
            # vocibuild's route is a multi-hop ProxyJump over Tailscale (xsvr1 -> xts
            # VIP -> vocibuild), which occasionally drops a single connection attempt
            # mid-handshake ("kex_exchange_identification: Connection closed by remote
            # host") — confirmed harmless and transient (the same route's Nix builder
            # connections succeed continuously; only this single, non-retried probe was
            # failing on the blip). Retry a few times before giving up, since one bad
            # attempt shouldn't skip the whole host's deploy.
            # ConnectTimeout=10 only bounds the initial TCP connect — a stall AFTER
            # that (e.g. mid-handshake inside the ProxyJump hop) isn't bounded by it,
            # so one bad attempt was observed taking 6+ minutes instead of ~10s
            # (confirmed 2026-08-06: 3 "retried" attempts still took 6m41s total).
            # Wrap each attempt in `timeout` for a hard wall-clock bound instead.
            REMOTE_HOSTNAME="UNREACHABLE"
            for attempt in 1 2 3; do
              # On the last attempt, if it fails, capture verbose diagnostics — no
              # local root/sops access exists to reproduce this manually, so this
              # is the only way to see exactly where the connection dies (DNS,
              # jump-hop auth, final auth, or a hang) with the real credentials.
              if [[ "$attempt" -eq 3 ]]; then
                if REMOTE_HOSTNAME=$(timeout 15 ssh \
                  -4 -vvv \
                  -i /run/secrets/deploy_private_key \
                  -o StrictHostKeyChecking=no \
                  -o UserKnownHostsFile=/dev/null \
                  -o ConnectTimeout=10 \
                  -o BatchMode=yes \
                  deploy@${DEPLOY_HOSTNAME} \
                  "hostname" 2>/tmp/vocibuild-ssh-debug.log); then
                  :
                else
                  REMOTE_HOSTNAME="UNREACHABLE"
                  echo "::group::vocibuild ssh -vvv diagnostics (final attempt only)"
                  cat /tmp/vocibuild-ssh-debug.log || true
                  echo "::endgroup::"
                fi
              else
                REMOTE_HOSTNAME=$(timeout 15 ssh \
                  -4 \
                  -i /run/secrets/deploy_private_key \
                  -o StrictHostKeyChecking=no \
                  -o UserKnownHostsFile=/dev/null \
                  -o ConnectTimeout=10 \
                  -o BatchMode=yes \
                  deploy@${DEPLOY_HOSTNAME} \
                  "hostname" 2>/dev/null || echo "UNREACHABLE")
              fi
              [[ "$REMOTE_HOSTNAME" == "$host" ]] && break
              [[ "$attempt" -lt 3 ]] && sleep 5
            done

            if [[ "$REMOTE_HOSTNAME" != "$host" ]]; then
              if [[ " ${OPTIONAL_HOSTS[*]} " == *" $host "* ]]; then
                echo "$host: SKIPPED — powered off (optional host)"
                SKIPPED+=("$host")
              else
                echo "$host: SKIPPED — hostname verification failed (got '${REMOTE_HOSTNAME}', expected '${host}')"
                DEPLOY_FAILED+=("$host")
              fi
              continue
            fi

            echo "$(ts) Deploying $host..."
            START=$(date +%s)
            # Run via our own flake's ".#deploy-rs" output, NOT the bare
            # "deploy-rs#deploy-rs" flake ref (see "Cache deploy-rs binary" step
            # above for why --inputs-from doesn't fix that form: it re-resolves
            # deploy-rs's own checked-in flake.lock, bypassing this repo's
            # deploy-rs.inputs.nixpkgs.follows fix for the crates.io 403). This
            # was the actual point of failure in run 33146595655 — every
            # aarch64 host's deploy died building activate-rs on the dead
            # crates.io/api/v1 endpoint.
            #
            # 60m circuit breaker: deploy-rs's nix copy/ssh transfer can stall
            # indefinitely mid-transfer with zero output (confirmed 2026-08-22:
            # xsvr3 hung 6.5h until GitHub's own 360m job timeout finally killed
            # the whole run, silently blocking every host queued after it —
            # xcomm1, xidm1, etc. never got a deploy attempt at all). Degrades
            # a stuck host to a normal per-host failure instead of taking down
            # the rest of the fleet. Raised from 40m (2026-08-28): xts1/xidm1/
            # xpbx1 now carry larger cold 26.05 closures to transfer than the
            # 15-32s typically observed, and 40m gave too little margin.
            if timeout 60m nix run ".#deploy-rs" -- --skip-checks ".#$host" 2>&1; then
              DURATION=$(( $(date +%s) - START ))
              printf 'deploy_last_success_timestamp_seconds{host="%s"} %s\ndeploy_duration_seconds{host="%s"} %s\ndeploy_git_revision_info{host="%s",revision="%s"} 1\ndeploy_total{host="%s",result="success"} 1\n' \
                "$host" "$(date +%s)" \
                "$host" "$DURATION" \
                "$host" "$REVISION" \
                "$host" \
                | curl --silent --data-binary @- "$PUSHGATEWAY/metrics/job/deploy/instance/$host" || true
              echo "$(ts) $host: DEPLOY OK (${DURATION}s)"
            else
              DEPLOY_RC=$?
              DEPLOY_FAILED+=("$host")
              if [ "$DEPLOY_RC" -eq 124 ]; then
                echo "$(ts) $host: DEPLOY TIMED OUT after 60m (stuck transfer or unreachable host)"
              fi
              printf 'deploy_total{host="%s",result="failure"} 1\n' "$host" \
                | curl --silent --data-binary @- "$PUSHGATEWAY/metrics/job/deploy/instance/$host" || true
              echo "$(ts) $host: DEPLOY FAILED"
            fi
          done

          echo "DEPLOY_FAILED_HOSTS=${DEPLOY_FAILED[*]}" >> "$GITHUB_ENV"
          echo "DEPLOY_SKIPPED_HOSTS=${SKIPPED[*]}" >> "$GITHUB_ENV"

          ALL_FAILED=("${FAILED_HOSTS[@]}" "${DEPLOY_FAILED[@]}")
          if [ ${#ALL_FAILED[@]} -gt 0 ]; then
            curl -f --show-error --http1.1 --max-time 10 -X POST "$APPRISE_URL" \
              -H "Content-Type: application/json" \
              -d "{\"title\":\"Deploy: Partial Failure\",\"body\":\"Build failed: ${FAILED_HOSTS[*]:-none} | Deploy failed: ${DEPLOY_FAILED[*]:-none} | Skipped (powered off): ${SKIPPED[*]:-none}\",\"type\":\"warning\",\"tag\":\"critical-infra\"}" || true
          fi

      - name: Deploy xsvr1 (self)
        run: |
          read -ra FAILED_HOSTS <<< "${BUILD_FAILED_HOSTS:-}"
          if [[ " ${FAILED_HOSTS[*]} " == *" xsvr1 "* ]]; then
            echo "xsvr1: skipping deploy (build failed)"
            exit 0
          fi
          echo "Deploying xsvr1 (self)..."
          # Create permit token. nixos-rebuild-ci.path watches for this file and
          # triggers nixos-rebuild-ci.service automatically — no systemctl call needed.
          # The builder user cannot call systemctl from inside the sandbox-hardened
          # runner service (D-Bus is inaccessible). Path-unit activation runs entirely
          # within systemd as root, bypassing the restriction.
          #
          # NOTE: nixos-rebuild will restart the github-runner service as part of
          # activation, killing this CI job. That is expected — the deploy succeeds
          # even though CI reports failure for this step. The runner comes back up
          # and picks up the next job with the new config applied.
          touch /zfs/nixcache/builds/github-runner/nixos-rebuild-ci-permitted
          echo "xsvr1: deploy triggered (path unit will fire nixos-rebuild asynchronously)"

      - name: Report final status
        if: always()
        run: |
          REVISION=$(git rev-parse --short HEAD)
          read -ra BUILD_FAILED <<< "${BUILD_FAILED_HOSTS:-}"
          read -ra DEPLOY_FAILED <<< "${DEPLOY_FAILED_HOSTS:-}"
          read -ra DEPLOY_SKIPPED <<< "${DEPLOY_SKIPPED_HOSTS:-}"
          ALL_FAILED=("${BUILD_FAILED[@]}" "${DEPLOY_FAILED[@]}")
          SKIPPED_SUFFIX=""
          if [ ${#DEPLOY_SKIPPED[@]} -gt 0 ]; then
            SKIPPED_SUFFIX=" | Skipped (powered off): ${DEPLOY_SKIPPED[*]}"
          fi

          if [ ${#ALL_FAILED[@]} -eq 0 ]; then
            curl -f --show-error --http1.1 --max-time 10 -X POST "$APPRISE_URL" \
              -H "Content-Type: application/json" \
              -d "{\"title\":\"Deploy: Complete\",\"body\":\"All hosts deployed successfully ($REVISION)${SKIPPED_SUFFIX}\",\"type\":\"success\",\"tag\":\"critical-infra\"}" || true
          else
            curl -f --show-error --http1.1 --max-time 10 -X POST "$APPRISE_URL" \
              -H "Content-Type: application/json" \
              -d "{\"title\":\"Deploy: Partial Failure\",\"body\":\"Build failed: ${BUILD_FAILED[*]:-none} | Deploy failed: ${DEPLOY_FAILED[*]:-none}${SKIPPED_SUFFIX} ($REVISION) — $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\",\"type\":\"failure\",\"tag\":\"critical-infra\"}" || true
            exit 1
          fi
